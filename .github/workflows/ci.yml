name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secret scanning (gitleaks CLI — action requires paid license for org repos) ─
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact

  # ── Lint: ruff + mypy --strict per Python service ───────────────────────────
  lint-python:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingestion]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync deps
        working-directory: ${{ matrix.service }}
        run: uv sync --frozen
      - name: ruff check
        working-directory: ${{ matrix.service }}
        run: uv run ruff check .
      - name: ruff format --check
        working-directory: ${{ matrix.service }}
        run: uv run ruff format --check .
      - name: mypy --strict
        working-directory: ${{ matrix.service }}
        run: uv run mypy src

  # ── Tests: unit + integration (testcontainers Postgres) with coverage gate ──
  test-python:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingestion]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync deps
        working-directory: ${{ matrix.service }}
        run: uv sync --frozen
      - name: pytest (unit + integration) with coverage gate
        working-directory: ${{ matrix.service }}
        run: uv run pytest --cov=${{ matrix.service }} --cov-report=term-missing --cov-fail-under=60

  # ── Frontend: eslint + typecheck + production build ─────────────────────────
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: build
        working-directory: frontend
        run: npm run build

  # ── Dockerfile lint ──────────────────────────────────────────────────────────
  hadolint:
    name: hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - api/Dockerfile
          - ingestion/Dockerfile
          - frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  # ── Build → scan → push (push only on main; build+scan also on PRs) ─────────
  build-push:
    name: Build & push (${{ matrix.service }})
    needs: [secret-scan, lint-python, test-python, frontend, hadolint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingestion, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image name (GHCR requires lowercase owner)
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/eventhub-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (load into local docker for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ steps.img.outputs.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push :sha and :latest (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${{ steps.img.outputs.image }}:${{ github.sha }}" "${{ steps.img.outputs.image }}:latest"
          docker push "${{ steps.img.outputs.image }}:${{ github.sha }}"
          docker push "${{ steps.img.outputs.image }}:latest"

  # ── Discord notification on any failure ─────────────────────────────────────
  notify-failure:
    name: Notify Discord on failure
    needs: [secret-scan, lint-python, test-python, frontend, hadolint, build-push]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_WEBHOOK set; skipping."; exit 0; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **CI failed** on \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:7}\`)\n${RUN_URL}\"}" \
            "$WEBHOOK"
