[project]
name = "eventhub-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",            # fast parser for BS4
  "python-dateutil>=2.9", # flexible date parsing
  "python-slugify>=8.0",
  "structlog>=24.1",
  "tenacity>=8.2",        # retry/backoff for fetches
  "tzdata>=2024.1",       # IANA tz database for zoneinfo (Windows + slim Docker)
  "prometheus-client>=0.20", # push run metrics to the Prometheus Pushgateway
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "testcontainers[postgres]>=4.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-python-slugify",
  "types-python-dateutil",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["unit: fast, no external deps", "integration: needs a real Postgres"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
