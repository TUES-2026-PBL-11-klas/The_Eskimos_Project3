[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# The actual URL is injected from ingestion.config.settings in migrations/env.py;
# this placeholder keeps Alembic happy for offline tooling.
sqlalchemy.url = postgresql+asyncpg://eventhub:eventhub@localhost:5432/eventhub
# Migration filenames: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
