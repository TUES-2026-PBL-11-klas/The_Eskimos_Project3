# One-shot ingestion pass on a schedule: migrate the events schema, then run the pipeline,
# then push run metrics to the Pushgateway (decision D3). Forbid overlapping runs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "eventhub.fullname" . }}-ingestion
  labels:
    {{- include "eventhub.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.ingestion.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "ingestion") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
            - name: ingestion
              image: {{ include "eventhub.image" (dict "ctx" . "svc" "ingestion") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["sh", "-c", "alembic upgrade head && python -m ingestion.main"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.db }}
                      key: INGESTION_DATABASE_URL
                - name: PUSHGATEWAY_URL
                  value: {{ .Values.ingestion.pushgatewayUrl | quote }}
                {{- with .Values.ingestion.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml .Values.ingestion.resources | nindent 16 }}
