apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventhub.fullname" . }}-api
  labels:
    {{- include "eventhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # zero-downtime: new pod ready before old is removed
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
        # Apply the users-DB schema migrations before the API starts. The image ships
        # alembic + migrations/ + alembic.ini (api/Dockerfile); env.py reads USERS_DB_URL.
        # Idempotent — a no-op once the DB is already at head — and gates readiness, so a
        # failed migration surfaces as the pod stuck in Init rather than 500s at runtime.
        - name: users-migrate
          image: {{ include "eventhub.image" (dict "ctx" . "svc" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: USERS_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: USERS_DB_URL
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      containers:
        - name: api
          image: {{ include "eventhub.image" (dict "ctx" . "svc" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: EVENTS_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: EVENTS_DB_URL
            - name: USERS_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.db }}
                  key: USERS_DB_URL
            - name: LOG_LEVEL
              value: {{ .Values.api.logLevel | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.api.corsOrigins | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eventhub.fullname" . }}-api
  labels:
    {{- include "eventhub.labels" . | nindent 4 }}
    {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
{{- if .Values.monitoring.serviceMonitor }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "eventhub.fullname" . }}-api
  labels:
    {{- include "eventhub.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
