apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventhub.fullname" . }}-frontend
  labels:
    {{- include "eventhub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "eventhub.image" (dict "ctx" . "svc" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # Server-side calls (SSR + BFF route handlers) target the in-cluster API service.
            - name: API_BASE_URL
              value: http://{{ include "eventhub.fullname" . }}-api:{{ .Values.api.port }}
            - name: EVENTHUB_USE_MOCK
              value: {{ .Values.frontend.useMock | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eventhub.fullname" . }}-frontend
  labels:
    {{- include "eventhub.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
