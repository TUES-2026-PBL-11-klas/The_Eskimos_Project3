# Retention worker: prune events older than cleanup_grace_days (ingestion config).
# Runs daily; uses the same image as ingestion but a different entry point.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "eventhub.fullname" . }}-cleanup
  labels:
    {{- include "eventhub.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "eventhub.selectorLabels" (dict "ctx" . "component" "cleanup") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
            - name: cleanup
              image: {{ include "eventhub.image" (dict "ctx" . "svc" "ingestion") }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "ingestion.cleanup"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.db }}
                      key: INGESTION_DATABASE_URL
              resources:
                {{- toYaml .Values.cleanup.resources | nindent 16 }}
